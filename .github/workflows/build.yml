name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Android files
        run: flutter create . --org com.smallbro.musicapp --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Upgrade Kotlin version
        run: |
          cd android
          sed -i 's/1.7.10/1.9.0/g' build.gradle 2>/dev/null || true
          sed -i 's/kotlin_version = .*/kotlin_version = "1.9.24"/g' build.gradle 2>/dev/null || true
          cd ..

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
